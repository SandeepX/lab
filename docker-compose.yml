services:
  backend:
    build: ./backend
    container_name: lab-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lab-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped